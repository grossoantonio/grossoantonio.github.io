---
layout: map-page
---
<div class="container-fluid map-container">
  <div class="row">
    <div class="col-xs-12">
      <!-- Map drawn by D:\webroot\_tools\osm-map from _map/map.yaml; sizes match its outputs.
           Markup and assets/css/location-map.css as in _tools/osm-map/grav/simple/ -->
      <div class="full-screen-map" id="map">
        <figure class="location-map">
          <a class="location-map__link" href="https://goo.gl/maps/HxyQVUdLJU42" rel="noopener" target="_blank" aria-label="{{ page.map_label }}">
            <picture>
              <source media="(min-width: 1500px)" srcset="/assets/img/map/contacts-map-ul.svg?v1" width="1920" height="600">
              <source media="(min-width: 992px)" srcset="/assets/img/map/contacts-map-lg.svg?v1" width="1280" height="500">
              <img class="location-map__image" src="/assets/img/map/contacts-map-phone.svg?v1" width="1000" height="300" alt="" loading="lazy" decoding="async">
            </picture>
          </a>
          <figcaption class="location-map__attribution">
            <a href="https://www.openstreetmap.org/copyright" rel="noopener" target="_blank" aria-label="© OpenStreetMap {{ page.new_tab }}">© OpenStreetMap</a>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</div>
<div class="container contacts-wrap">
  <div class="row justify-content-between mb-4">
    <div class="col-sm-6 col-md-5">
      <img
        class="logo mb-4"
        src="/assets/img/grosso-antonio-logo.svg"
        alt="Grosso Antonio logo">
      <p class="icon-envelope-o ms-2">
        <a class="email-link" href="mailto: info@grossoantonio.it">info@grossoantonio.it</a><br>
      </p>
    </div>
    <div class="col-sm-6 col-md-5">
      <img
        class="logo"
        src="/assets/img/grosso-antonio-2-logo.svg"
        alt="Grosso Antonio 2.0 logo">
      <p class="icon-envelope-o ms-2">
        <a class="email-link" href="mailto: grossoantonio2.0srl@grossoantonio.it">grossoantonio2.0srl@grossoantonio.it</a>
      </p>
    </div>
  </div>
  <div class="row justify-content-between">
    <div class="col-sm-6 col-md-5 text-sm-left text-xs-center">
      <h1 class="title-small m-b-2">{{ page.contacts }}
        <span class="icon-notebook"></span>
      </h1>
      <p class="icon-phone">
        Tel. (+39) 0571 486090 (r.a.)
      </p>
    </div>
    <div class="col-sm-6 col-md-5 text-sm-right text-xs-center">
      <h1 class="title-small m-b-2 icon-map">{{ page.address }}</h1>
      <p class="">
        Via del Salice, 6/8 <br>
        Zona Ind. Macrolotto <br>
        56022 Castelfranco di Sotto <br>
        Pisa, Italy <br>
      </p>
    </div>
  </div>
</div>
